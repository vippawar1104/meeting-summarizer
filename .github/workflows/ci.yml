name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: reviewly
          POSTGRES_PASSWORD: reviewly
          POSTGRES_DB: reviewly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reviewly" --health-interval 5s --health-retries 10
    env:
      REVIEWLY_TEST_PG_URL: postgresql+psycopg://reviewly:reviewly@localhost:5432/reviewly_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python -m eval.validate
      - run: uv run python -m eval.gate --model baseline:regex --prompt v1
      - run: if [ -d tests ]; then uv run pytest -q; else echo "no tests directory in this checkout, skipping"; fi
