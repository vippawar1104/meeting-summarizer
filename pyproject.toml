[project]
name = "reviewly"
version = "0.1.0"
description = "AI pull request reviewer GitHub App"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "pyjwt[crypto]>=2.15.0",
  "pyyaml>=6.0.3",
  "tree-sitter>=0.26.0",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-typescript>=0.23.2",
  "tree-sitter-go>=0.25.0",
  "tree-sitter-java>=0.23.5",
  "pgvector>=0.5.0",
  "opentelemetry-api>=1.45.0",
  "opentelemetry-sdk>=1.45.0",
  "opentelemetry-exporter-otlp-proto-http>=1.45.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "fakeredis[lua]>=2.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyyaml>=6.0.12.20260906",
  "hypothesis>=6.168.1",
  "locust>=2.46.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # `ruff format` owns layout; long f-strings are fine

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "worker", "eval"]

[[tool.mypy.overrides]]
module = ["sqlmodel.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
